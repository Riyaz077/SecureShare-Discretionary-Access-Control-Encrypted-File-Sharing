{% extends 'base.html' %}{% block content %}<div class="auth-card"><div class="eyebrow">START SECURE</div><h1>Create account</h1><p class="muted">Set up your personal file-sharing workspace.</p><form method="post"><label>Username</label><input name="username" minlength="3" required autocomplete="username"><label>Email address</label><input type="email" name="email" required autocomplete="email"><label>Password</label><input type="password" name="password" minlength="8" required autocomplete="new-password"><small>Use at least 8 characters.</small><button class="btn primary full">Create account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
